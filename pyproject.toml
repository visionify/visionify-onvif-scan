[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onvif-scan"
version = "0.1.0"
description = "Discover, test and report on ONVIF cameras for customer onboarding."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Visionify" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "WSDiscovery>=2.0",
    "onvif-zeep>=0.2.12",
    "opencv-python-headless>=4.8",
    "numpy>=1.24",
    "openpyxl>=3.1",
    "jinja2>=3.1",
    "requests>=2.31",
]

[project.scripts]
onvif-scan = "onvif_scan.cli:app"

[tool.setuptools]
packages = ["onvif_scan"]

[tool.setuptools.package-data]
onvif_scan = ["templates/*.html"]
